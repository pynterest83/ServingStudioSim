schema_version: 1
pack: glm53_flash_fp8_h200_tp4_mtp5
description: >-
  GLM-5.3-Flash FP8 on H200 in the production deployment (vLLM v0.31.0 fork, TP4/DP1 without
  expert parallelism, BF16 KV cache, MTP with 5 speculative tokens; https://recipes.vllm.ai/zai-org/GLM-5.3-Flash
  adapted to Hopper). Cases 01-13 reuse the B200 TP4/EP4 matrix's shapes, repeats and concurrency so the two
  GPUs stay comparable. Cases 14/15 are left out until their pinned KV pools are re-derived for the BF16 KV
  footprint. The measured side (profile passes) is the production engine; the simulated side is the H200
  speculative arch (Triton fused MoE without EP, FLASH_ATTN_MLA_SPARSE FA3, FlashKDA, MTP 5) with the
  host-time worker model. Measurements taken before the 2026-10-08 node tuning (see recorded_on.host_conditions)
  are not comparable with measurements taken after it.
recorded_on:
  host: h200
  gpu: NVIDIA H200
  # Shared read-only copy (team10-obs PVC); weights and config identical to the B200 pack's 03eb5366.
  checkpoint_snapshots: {glm53_flash: GLM-5.3-Flash@eb9eb208eb0d988989d07a6a12d0fdeb5f52574a}
  nsys_version: 2025.5.2
  device_roles: {primary: '4,5,6,7'}
  # Measurement contract since 2026-10-08 (node hgx45 tuned by the admins; lost on node reboot). Every
  # profile pass logs these before it starts and stops if they no longer hold. Baselines measured before
  # this (logs/20261007_0_glm53_flash_h200_campaign, untuned: default governor, C-states on, unlocked
  # GPU clocks) are not comparable with baselines measured under it.
  host_conditions:
    since: '2026-10-08'
    gpu_sm_clock_lock_mhz: 1980        # GPUs 4-7, application clock mode 1 (nvidia-smi clocks.sm = 1980)
    cpu_governor: performance          # CPUs 48-95 and 144-191 (NUMA 2-3, the GPU 4-7 side)
    cpu_cstates_disabled: [C1E, C6]
    smt_contention: about 40% remaining (admin micro-benchmark; launch time 1.5-3.3x faster than before)
    # Server environment for the re-measurement (exported by the workspace .env; the vLLM server inherits it):
    # VLLM_DEEP_GEMM_WARMUP=full (default "relax" is a heuristic; the untuned case-03 workload pass had two
    # ~2.7 s mid-replay stalls with no Triton JIT warning), and persistent VLLM_CACHE_ROOT / TRITON_CACHE_DIR /
    # TORCHINDUCTOR_CACHE_DIR outside any worktree so JIT/compile work is reused across runs.
    server_env: {VLLM_DEEP_GEMM_WARMUP: full}
variants:
  tp4_dp1_mtp5:
    deployment: unified
    gpu: NVIDIA H200
    replicas: 1
    checkpoint: glm53_flash
    engine: vllm
    backend: vllm_tokens
    run_name_prefix: glm53_flash_h200_tp4_mtp5
    server:
      tp_size: 4
      dp_size: 1
      # vLLM v0.31's own default on a >=70 GiB, <160 GiB GPU (OpenAI server): the production chunk budget.
      chunk_size: 8192
      # max_cudagraph_capture_size is left unset so vLLM keeps its production default (512 with MTP 5).
      enable_server_load_tracking: true
      # Production runs 1 (v0.31 default at DP1). 4 keeps HTTP ingress serialization (~0.75 ms/request on
      # GLM-5.3-Flash TP4) out of the engine's arrival pattern, which the simulator does not model.
      api_server_count: 4
      # No --enable-expert-parallel (production runs the 288 experts on every rank with the Triton FP8 MoE).
      # `auto` keeps the checkpoint dtype: Hopper has no sparse-MLA backend for an FP8 KV cache.
      # Multimodal input off (production serves it but the matrix is text-only): the vllm_tokens backend
      # starts vLLM with --tokens-only, and v0.31 refuses to build Glm5NextMultiModalProcessor without a
      # tokenizer. Same flag as the B200 pack; check the attention/MoE backends still match production.
      extra_args: [--kv-cache-dtype, auto, --speculative-config, '{"method":"mtp","num_speculative_tokens":5}',
        --limit-mm-per-prompt, '{"image":0,"video":0}']
    # The H200 production arch: TP4 without EP, Triton FP8 fused MoE, FLASH_ATTN_MLA_SPARSE (FA3) with a
    # BF16 cache, FlashKDA prefill, MTP-5 drafter. Routing: this pack's own case-03 capture (43 layers incl.
    # MTP). Path relative to this pack (repo logs/, local evidence) until it is hosted by repository and revision (the user uploads it).
    arch:
      type: glm53_flash_vllm_fp8_kda_dsa_moe_speculative
      model_config: model/config/glm53_flash.json
      fp8: true
      tp_size: 4
      draft_tokens: 5
      routing: corpus
      token_corpus_file: ../../../logs/20261007_0_glm53_flash_h200_campaign/03_balanced_anchor_c32/profile_corpus/token_corpus/manifest.json
      # The capture sizes the production run logged (MTP 5 adds 6 and 12).
      cudagraph_capture_sizes: [1, 2, 4, 6, 8, 12, 16, 24, 32, 40, 48, 56, 64, 72, 80, 88, 96, 104, 112, 120,
        128, 136, 144, 152, 160, 168, 176, 184, 192, 200, 208, 216, 224, 232, 240, 248, 256, 272, 288, 304,
        320, 336, 352, 368, 384, 400, 416, 432, 448, 464, 480, 496, 512]
    # Speculative worker on the hybrid KV store (recurrent state pinned per request). No gpu_time_multiplier:
    # the host-time model replaces it, cycle = max(kernel + host_fixed, host_floor[graph mode]).
    # Host values fitted ONLY on the tuned-host (2026-10-08) WORKLOAD passes of cases 03/04/05/10 (4199 engine
    # steps; kernel time + graph mode from timing-predict of the workload iterations; logs/20261008_5_glm53_flash_
    # h200_tuned/host_fit/workload_pooled.json): fixed 1.02 ms, eager-with-prefill 153.7 ms (binds 438), eager
    # decode-only 125.1 ms (binds 816); full-graph and piecewise floors never bind (kernel + fixed is always
    # above them) and are set to 0. Cycle |error| p50 2.1% / p90 7.3%, total +0.7%. The nsys passes are not used:
    # nsys tracing inflates the eager host floor (~155-165 ms vs ~111-123 ms).
    worker: {type: speculative, max_batch_tokens: 8192, batch_policy: mix, draft_tokens: 5, acceptance_seed: 73,
      host_fixed_ms: 1.02, host_floor_full_graph_ms: 0.0, host_floor_piecewise_ms: 0.0,
      host_floor_eager_prefill_ms: 153.65, host_floor_eager_decode_ms: 125.13,
      # vLLM-reproduction rule (a framework constraint, not a target design): the hybrid prompt's last
      # cacheable prefill chunk stops one block early under the MTP drafter (use_eagle_block_drop).
      eagle_block_drop: true}
    profile_passes:
    - {kind: workload_metrics, name: profile_workload, trace: workload, warmup: true}
    - {kind: nsys, name: profile_nsys, trace: kernel, warmup: true}
    # Measured routing demand of every accepted token, body and MTP layer (openai backend, the one that
    # returns routes). No EP, so no expert-load stream is taken.
    - {kind: token_corpus, name: profile_corpus, trace: workload}
    input_builder: {type: speculative_engine_text, draft_tokens: 5, measured_phase: forward, group_assignment: per_dp_rank}
    label_rules: label_rules/manifest.json
