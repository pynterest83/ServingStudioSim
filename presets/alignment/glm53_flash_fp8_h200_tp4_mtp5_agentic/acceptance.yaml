# Acceptance policy of the agentic pack: glm53_flash_fp8_h200_tp4_mtp5's tolerances, unchanged until this
# workload's own evidence re-earns them. Its stochastic_scoring block needs per-request acceptance chains, which a
# session-trace case does not take (one chain per round from speculative_acceptance), so it does not apply to
# case 20 yet.
#
# Inherited header: acceptance policy for the GLM-5.3-Flash FP8 H200 TP4/MTP5 matrix (inherited from the B200
# TP4/EP4 pack; no H200 evidence yet).
#
# Tolerances only. The formulas that produce the numbers live in
# `launcher/alignment_campaign/metrics.py`: they depend on the Analyzer report
# schema, not on the model, so copying them into each pack would create N copies
# to keep in sync.
#
# Tolerances are also deliberately NOT in the golden store. Re-recording measured
# values is routine; moving the standard those values are judged against should
# be a reviewed edit to a tracked file. Sharing one store would let `--record`
# quietly change the goalposts along with the numbers.
schema_version: 1

# The report schemas these tolerances were written against. `compare` refuses to
# record a golden when a run's reports disagree, because a duration-weighted
# kernel error (schema 2+) and an unweighted per-iteration mean (schema 1) are
# different statistics, and schema 3 measures the barrier critical path rather
# than one device's; either way they would otherwise share a key.
analyzer_schema:
  iteration: 3
  e2e: 1
  workload: 1

# Fraction of a tolerance a value may consume before it is WARN rather than OK.
# One knob rather than a second threshold per metric: "close to the declared
# edge" is the actionable signal, and nobody has data to set fifteen warn bands.
warn_fraction: 0.8

tolerances:
  default:
    # Check 1 — kernel timing (tightest, most diagnostic).
    kernel_abs_pct: 5.0
    kernel_signed_pct: 5.0
    # A floor, not a bound: mapping coverage below this means a large measured
    # kernel has no simulated counterpart, which invalidates the timing above it.
    map_coverage_pct: 97.0
    # Check 2 — duty cycle. This pack's simulated side has no GPU-time multiplier:
    # the worker's host-time model (cycle = max(kernel + host_fixed,
    # host_floor[graph mode]), fitted by tools/host-time-fit) turns kernel time
    # into iteration time, so the duty cycle is judged on the simulated vs
    # measured iteration cycle it produces. kernel-align's
    # recommended_gpu_time_multiplier stays in the iteration report as a
    # diagnostic only; it pools host-bound eager and graph-replayed iterations
    # (case 03: decode 1.06, mixed 1.93), which is what a multiplier cannot model.
    # Its ceiling is therefore a sanity bound, not the duty-cycle gate: 2.5 flags
    # host bubbles beyond the eager host floor the model is fitted to (a stall or
    # a contended host), while the iteration-cycle error below is what passes or
    # fails the duty cycle. (Was 1.5, the multiplier-model bound.)
    gpu_time_multiplier: 2.5
    iteration_cycle_mean_pct: 8.0
    # Workload structure. These compare the two sides' scheduler behaviour on the
    # same trace. Where scheduling agrees they are near-exact (cases 11-15 are at
    # 0.000-0.129%), so the default stays tight on purpose: a breach says the
    # simulation executed a different iteration population, not that it mistimed
    # the one it ran, and per `skills/top-align-with-framework` that difference
    # must be reported rather than folded into the timing conclusion. The cases
    # that do diverge carry an explicit exception below.
    iterations_pct: 1.0
    prefill_tokens_mean_pct: 1.0
    decode_batch_mean_pct: 1.0
    scheduled_kv_mean_pct: 1.0
    # Check 3 — end to end (loosest). TTFT is expected to run a little fast in
    # the simulator: vLLM's async scheduler adds first-token latency that is not
    # modelled, so a small sim-faster gap is expected and is not a defect.
    output_tps_pct: 8.0
    server_ttft_mean_pct: 12.0
    server_tpot_mean_pct: 11.0
    e2e_mean_pct: 7.0

  # Every exception states why. A loosened threshold with no reason on it is
  # indistinguishable from a silently accepted regression, which is why `check`
  # rejects one without a rationale.
  # No per-case exceptions yet: the GLM-5.2 ones describe that model's run and
  # must be re-earned from this matrix's own evidence, each with a rationale.
  per_case: {}

# Stochastic scoring of the speculative (MTP) cases. The single-run tolerances above stay as diagnostics for the
# workload-structure metrics; scoring follows this block (scoring/stochastic_score.py).
# Why: with MTP and per-request acceptance (speculative_acceptance_per_request), the iteration count of a run is a
# random variable -- it depends on which request draws which acceptance chain, i.e. who finishes last and how
# long the drain tail runs. The measured run is ONE sample of it: re-pairing the measured per-request rounds
# within each shape moves the replica's iteration count by sd 3.8% (case 03), 1.7% (04) and 8.5% (05), p5-p95 up
# to -10..+17%, so a 1% single-run bound on iterations is below the comparison's own sampling noise.
stochastic_scoring:
  # (i) Deterministic part, 1% tolerance.
  deterministic_tolerances:
    # Simulated decode (verify) rounds of the WHOLE case, mean over the seeds, vs measured.
    rounds_total_pct: 1.0
    # replica.py with vLLM v0.31's scheduling rules on the MEASURED per-request rounds vs the measured iteration
    # count (closed-loop saturated cases; n/a for rate-driven cases, which the replica does not model).
    replica_iterations_pct: 1.0
  # Per-shape rounds are a diagnostic, not a score: a shape with few requests or few rounds has per-round draw
  # noise far above 1% (case 12 has one request per shape: up to +7.4%). Its standard error is bootstrapped from
  # the measured per-request rounds of that shape; a shape is flagged only when |simulated - measured| > 3 SE.
  rounds_by_shape_diagnostic: {flag_sigma: 3.0, bootstrap_resamples: 2000}
  # (ii) Stochastic part: simulate under >= min_seeds hash orders of the chain assignment.
  min_seeds: 50
  # The measured iteration count must lie inside the simulated [p5, p95]; its percentile is reported.
  iterations_band: [5, 95]
  # A band of zero width (no re-pairing freedom left, e.g. case 12 with one request per shape) has no sampling
  # spread to judge against: the iteration count then falls back to the deterministic 1% bound.
  zero_width_band_iterations_pct: 1.0
  # e2e / throughput / TPOT / TTFT (and the structure metrics) are reported as simulated mean +- sd against the
  # measured value and its measured noise band; the single-run tolerances above judge the simulated MEAN.
  judge_mean_against: tolerances.default
  # Not scored: one run with each trace request given the chain of the same measured request id, to show what
  # remains when the pairing matches the measured sample (the scheduling rules alone).
  diagnostic: measured_id
